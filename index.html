<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10101a">
  <title>My Socials</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, Helvetica, sans-serif; color: #fff;
      background: radial-gradient(circle at top, #30204f 0, #171526 42%, #0b0b12 100%);
    }
    .card {
      width: min(100%, 420px); padding: 36px 26px; text-align: center;
      border: 1px solid rgba(255,255,255,.14); border-radius: 28px;
      background: rgba(255,255,255,.07); box-shadow: 0 20px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    .avatar {
      width: 76px; height: 76px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 50%; font-size: 32px; font-weight: 800;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
    }
    h1 { margin: 0 0 9px; font-size: 29px; letter-spacing: 1px; }
    p { margin: 0 0 27px; color: #c8c5d7; line-height: 1.5; }
    .link {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; margin: 13px 0; padding: 17px 20px; border-radius: 15px;
      color: white; text-decoration: none; font-size: 17px; font-weight: 700;
      transition: transform .18s ease, filter .18s ease;
    }
    .link:hover { transform: translateY(-2px); filter: brightness(1.12); }
    .tiktok { background: #171717; border: 1px solid #555; }
    .facebook { background: #1877f2; }
    .icon { font-size: 22px; }
    footer { margin-top: 25px; color: #8f8ba3; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">S</div>
    <h1>MY SOCIALS</h1>
    <p>Choose where you want to visit me ✨</p>
    <a class="link tiktok" href="https://www.tiktok.com/@gehlee_super_idol?_r=1&_t=ZS-9BAexsNmoLp" target="_blank" rel="noopener noreferrer">
      <span class="icon">♪</span> Follow me on TikTok
    </a>
    <a class="link facebook" href="https://www.facebook.com/share/1EEwQ7mJ63/" target="_blank" rel="noopener noreferrer">
      <span class="icon">f</span> Visit my Facebook
    </a>
    <footer>Thanks for visiting my page ♡</footer>
  </main>
</body>
</html>

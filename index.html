<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#EAF3F2;
    --bg-bottom:#D7E8E4;
    --ink:#1F2A28;
    --card:#FFFFFF;
    --accent:#2E7D6B;
    --ig-a:#F58529;
    --ig-b:#DD2A7B;
    --ig-c:#8134AF;
    --fb:#1877F2;
    --muted:#5C6B68;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px 60px;
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--card);
    border-radius:24px;
    box-shadow:0 20px 50px rgba(31,42,40,0.12);
    padding:36px 26px 30px;
    text-align:center;
  }
  .avatar-wrap{
    width:132px;
    height:132px;
    margin:0 auto 18px;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(135deg, var(--accent), #7FC8B8);
  }
  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:3px solid var(--card);
    display:block;
  }
  h1{
    font-family:'Fraunces', serif;
    font-size:1.5rem;
    margin:0 0 6px;
    letter-spacing:0.2px;
  }
  .tagline{
    font-size:0.9rem;
    color:var(--muted);
    margin:0 0 22px;
    line-height:1.5;
  }
  .divider{
    height:1px;
    background:#E7EEEC;
    margin:22px 0;
  }
  .eyebrow{
    font-size:0.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:14px;
  }
  .social-links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .social-btn{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-radius:14px;
    text-decoration:none;
    color:#fff;
    font-weight:600;
    font-size:0.95rem;
    transition:transform 0.15s ease, filter 0.15s ease;
  }
  .social-btn:active{ transform:scale(0.97); }
  .social-btn.ig{
    background:linear-gradient(135deg, var(--ig-a), var(--ig-b) 55%, var(--ig-c));
  }
  .social-btn.fb{
    background:var(--fb);
  }
  .social-btn svg{ width:22px; height:22px; flex-shrink:0; }
  .social-btn span{ flex:1; text-align:left; }
  .social-btn .arrow{ opacity:0.85; font-size:1.1rem; flex:0; }

  .footer-note{
    margin-top:24px;
    font-size:0.7rem;
    color:var(--muted);
    opacity:0.7;
  }
</style>
</head>
